
      - name: Prepare EasyLoad Assets
        shell: bash
        run: |
          set -e

          echo "Checking existing logo folders..."

          test -d assets/provider_logos

          if [ -f easyload_logo.png ]; then
            cp -f easyload_logo.png assets/easyload_logo.png
          fi

          test -f assets/easyload_logo.png

          echo "EasyLoad logo found."
          echo "Provider logos:"
          ls -la assets/provider_logos
