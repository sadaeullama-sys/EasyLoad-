
name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.5'
          channel: stable

      - name: Configure Java
        run: flutter config --jdk-dir="$JAVA_HOME"

      - name: Check Project Files
        run: |
          echo "Checking project files..."
          test -f pubspec.yaml
          test -f lib/main.dart
          echo "Project files found."

      - name: Prepare EasyLoad Assets
        run: |
          mkdir -p assets/provider_logos

          if [ -f easyload_logo.png ]; then
            cp easyload_logo.png assets/easyload_logo.png
          fi

          if [ ! -f assets/easyload_logo.png ]; then
            echo "ERROR: EasyLoad logo is missing."
            exit 1
          fi

          for f in ./*.png ./*.jpg ./*.jpeg ./*.webp; do
            [ -f "$f" ] || continue
            if [ "$(basename "$f")" != "easyload_logo.png" ]; then
              cp "$f" assets/provider_logos/
            fi
          done

          echo "Available provider logos:"
          ls -la assets/provider_logos/
          test -f assets/easyload_logo.png

      - name: Create Android Project
        run: |
          rm -rf android
          flutter create \
            --project-name=easeload_shop_manager \
            --platforms=android \
            --org com.ilyasmobile .

      - name: Set Android Gradle and Kotlin Versions
        run: |
          python3 - <<'PY'
          import re

          p = "android/settings.gradle"
          with open(p, "r") as f:
              s = f.read()

          s = re.sub(
              r'(id\s+["\']com\.android\.application["\']\s+version\s+)["\'][^"\']+["\']',
              r'\g<1>"8.7.3"',
              s
          )

          s = re.sub(
              r'(id\s+["\']org\.jetbrains\.kotlin\.android["\']\s+version\s+)["\'][^"\']+["\']',
              r'\g<1>"2.1.0"',
              s
          )

          with open(p, "w") as f:
              f.write(s)

          print(s)
          PY

          mkdir -p android/gradle/wrapper

          sed -i \
            's#distributionUrl=.*#distributionUrl=https\\://services.gradle.org/distributions/gradle-8.9-all.zip#' \
            android/gradle/wrapper/gradle-wrapper.properties

      - name: Verify Android Versions
        run: |
          cat android/settings.gradle
          cat android/gradle/wrapper/gradle-wrapper.properties

      - name: Get Dependencies
        run: flutter pub get

      - name: Build Release APK
        run: flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: EasyLoad-Shop-Manager-APK
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
