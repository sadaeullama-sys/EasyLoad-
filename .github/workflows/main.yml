
      - name: Prepare EasyLoad Assets
        shell: bash
        run: |
          set -e

          echo "Checking assets folders..."

          mkdir -p assets

          if [ -e assets/provider_logos ] && [ ! -d assets/provider_logos ]; then
            rm -f assets/provider_logos
          fi

          if [ ! -d assets/provider_logos ]; then
            mkdir assets/provider_logos
          fi

          if [ -f easyload_logo.png ]; then
            cp -f easyload_logo.png assets/easyload_logo.png
          fi

          if [ -f assets/easyload_logo.png ]; then
            echo "EasyLoad logo found."
          else
            echo "ERROR: EasyLoad logo missing."
            ls -la
            exit 1
          fi

          echo "Provider logo folder:"
          ls -la assets/provider_logos

          echo "Assets preparation completed."
